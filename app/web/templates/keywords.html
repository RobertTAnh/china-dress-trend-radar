{% extends "base.html" %}
{% block title %}Từ khóa · {{ app_name }}{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Từ khóa theo dõi</h1>
<form class="panel mb-4" method="post" action="/keywords">
  <div class="row g-2 align-items-end">
    <div class="col-md-4">
      <label class="form-label">Từ khóa tiếng Trung</label>
      <input class="form-control" name="keyword" required>
    </div>
    <div class="col-md-5">
      <label class="form-label">Nghĩa tiếng Việt</label>
      <input class="form-control" name="vietnamese_meaning">
    </div>
    <div class="col-md-3">
      <button class="btn btn-accent w-100" type="submit">Thêm từ khóa</button>
    </div>
  </div>
</form>

{% for item in keywords %}
<form class="keyword-row" method="post" action="/keywords/{{ item.id }}/update">
  <div class="row g-2 align-items-end">
    <div class="col-md-3">
      <label class="form-label">Từ khóa</label>
      <input class="form-control" name="keyword" value="{{ item.keyword }}">
    </div>
    <div class="col-md-4">
      <label class="form-label">Nghĩa tiếng Việt</label>
      <input class="form-control" name="vietnamese_meaning" value="{{ item.vietnamese_meaning }}">
    </div>
    <div class="col-md-2">
      <label class="form-label">Trạng thái</label>
      <div>{% if item.active %}<span class="badge text-bg-success">Bật</span>{% else %}<span class="badge text-bg-secondary">Tắt</span>{% endif %}</div>
    </div>
    <div class="col-md-3 d-flex gap-2">
      <button class="btn btn-outline-light" type="submit">Lưu</button>
    </div>
  </div>
</form>
<div class="d-flex gap-2 mb-4">
  <form method="post" action="/keywords/{{ item.id }}/toggle">
    <button class="btn btn-sm btn-outline-warning" type="submit">{% if item.active %}Tắt{% else %}Bật{% endif %}</button>
  </form>
  <form method="post" action="/keywords/{{ item.id }}/delete" onsubmit="return confirm('Xóa từ khóa này?');">
    <button class="btn btn-sm btn-outline-danger" type="submit">Xóa</button>
  </form>
</div>
{% endfor %}
{% endblock %}
